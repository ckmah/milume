<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landmarks dev harness — milume</title>
    <script>
      (function () {
        var theme = localStorage.getItem("milume-harness-theme");
        var dark = theme !== "light";
        document.documentElement.className = dark
          ? "dark dark-theme"
          : "light light-theme";
      })();
    </script>
    <style>
      html.light {
        color-scheme: light;
        --harness-page-bg: #fcfcfd;
        --harness-cell-bg: #f9f9fb;
        --harness-text: #1c2024;
        --harness-muted: #687076;
        --harness-banner: #b45309;
        --harness-cell-ring: rgb(28 32 36 / 8%);
      }

      html.dark {
        color-scheme: dark;
        --harness-page-bg: #111113;
        --harness-cell-bg: #18191b;
        --harness-text: #edeef0;
        --harness-muted: #9ba1a6;
        --harness-banner: #fbbf24;
        --harness-cell-ring: rgb(237 238 240 / 10%);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--harness-page-bg);
        color: var(--harness-text);
        font-family: system-ui, -apple-system, sans-serif;
      }

      .harness-shell {
        box-sizing: border-box;
        width: 100%;
        max-width: none;
        min-height: 100vh;
        margin: 0;
        padding: 0.75rem 1rem 1.25rem;
      }

      .harness-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .harness-banner {
        margin: 0;
        font-size: 0.625rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--harness-banner);
      }

      .harness-cell-output {
        box-sizing: border-box;
        width: 100%;
        padding: 0.75rem;
        /* Flat notebook cell — avoid card-like radius/shadow that nests float panels. */
        background: var(--harness-cell-bg);
      }
    </style>
  </head>
  <body>
    <div id="harness-root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
