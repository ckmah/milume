name: Recipe export
description: >-
  Restore the shared squidpy recipe export, or produce it once and publish the
  artifact other workflows download. The cache key is the input hash from
  scripts/recipe_export_cache.py.

inputs:
  mode:
    description: produce (run export and verify on a miss) or consume (download that artifact)
    required: true

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "key=$(python3 scripts/recipe_export_cache.py key)" >> "$GITHUB_OUTPUT"
        echo "compute=$(python3 scripts/recipe_export_cache.py compute-key)" >> "$GITHUB_OUTPUT"

    # Exact key only. A prefix restore would reuse another commit's export.
    # v2 splits the squidpy export (no frontend sources) from the full stamp.
    - id: cache-full
      uses: actions/cache/restore@v4
      with:
        path: website/.cache/recipe-export
        key: recipe-export-v2-${{ runner.os }}-${{ steps.key.outputs.key }}

    - id: cache-compute
      if: steps.cache-full.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: website/.cache/recipe-export
        key: recipe-compute-v2-${{ runner.os }}-${{ steps.key.outputs.compute }}

    - name: Node for widget repack
      if: steps.cache-full.outputs.cache-hit != 'true' && steps.cache-compute.outputs.cache-hit == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Frontend deps for widget repack
      if: steps.cache-full.outputs.cache-hit != 'true' && steps.cache-compute.outputs.cache-hit == 'true'
      uses: ./.github/actions/node-modules
      with:
        dir: frontend

    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CACHE_HIT_FULL: ${{ steps.cache-full.outputs.cache-hit }}
        CACHE_HIT_COMPUTE: ${{ steps.cache-compute.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.key.outputs.key }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # pull_request sets GITHUB_SHA to the merge commit, and the runner
        # keeps that value even when a step names GITHUB_SHA in env. The
        # Actions API lists runs by the head commit.
        RECIPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: bash scripts/recipe_export_fetch.sh

    - if: inputs.mode == 'produce' && steps.cache-full.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: website/.cache/recipe-export
        key: recipe-export-v2-${{ runner.os }}-${{ steps.key.outputs.key }}

    # Only a full squidpy run may publish the compute cache. A repack is
    # frontend-specific and must not replace that blob.
    - if: inputs.mode == 'produce' && steps.cache-full.outputs.cache-hit != 'true' && steps.cache-compute.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: website/.cache/recipe-export
        key: recipe-compute-v2-${{ runner.os }}-${{ steps.key.outputs.compute }}

    # .cache is a hidden path segment. Without this flag the artifact is empty
    # and every consumer fails the stamp check.
    - uses: actions/upload-artifact@v4
      with:
        name: recipe-export
        path: website/.cache/recipe-export
        retention-days: 3
        if-no-files-found: error
        include-hidden-files: true
