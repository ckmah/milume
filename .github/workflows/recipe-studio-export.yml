# View assertions and prose lint for the shared recipe export (recipe-compute.yml).
name: Recipe studio export

on:
  pull_request:
    branches: [main]
    paths:
      - "demos/recipes/**"
      - "website/scripts/export-recipes.sh"
      - "website/scripts/prepare_recipe_studio.py"
      - "website/scripts/recipe_widget_esm.py"
      - "website/scripts/assemble-pages.sh"
      - ".github/workflows/recipe-studio-export.yml"
      - ".github/actions/recipe-export/**"
      - "scripts/recipe_export_cache.py"
      - "scripts/recipe_export_fetch.sh"
      - "frontend/**"
      - "milume/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/squidpy_color_recipes.py"
  push:
    branches:
      - main
    paths:
      - "demos/recipes/**"
      - "website/scripts/export-recipes.sh"
      - "website/scripts/assemble-pages.sh"
      - ".github/workflows/recipe-studio-export.yml"
      - ".github/actions/recipe-export/**"
      - "scripts/recipe_export_cache.py"
      - "scripts/recipe_export_fetch.sh"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: recipe-studio-export-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/recipe-export
        with:
          mode: consume

      - name: View assertions on the shared export
        run: python3 scripts/recipe_export_cache.py assert-views

      - name: Recipe prose lint
        run: python3 scripts/lint_recipe_prose.py --recipe squidpy_color
