name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: uv sync --group dev

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(uv run python -c "import milume; print(milume.__version__)")
          test "$TAG" = "$VERSION"

      - run: uv run pytest
      - run: scripts/check-demo-pins.sh
      - run: uv build
      - run: uv publish

  # Separate job so the pypi job keeps contents: read. Runs only after `uv publish`
  # succeeded, and only for v* tags (a workflow_dispatch from a branch has no release).
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all v* tags, for the previous tag in the compare link

      - name: Create or update the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Fails (and stops here) when the CHANGELOG section is missing or empty.
          python3 scripts/changelog_section.py "$VERSION" --tag "$TAG" > "$RUNNER_TEMP/notes.md"
          if [ "$(python3 scripts/changelog_section.py "$VERSION" --is-prerelease)" = true ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          # Idempotent: a re-run (or a release made by hand) is updated, not duplicated.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
