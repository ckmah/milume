name: Stale bot PRs

# Every 6 h: ready PRs from bot branches (cursor/, claude/, codex/, agent/, bot/) with red or
# pending CI and no push for 6 h get one `stalled` comment per head SHA (#263).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: Hours without a push before a PR counts as stalled
        required: false
        default: "6"
      pr:
        description: Only this PR number (optional)
        required: false

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: stale-prs
  cancel-in-progress: false

jobs:
  stalled:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: Check for open bot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.pr }}" ]]; then
            echo "workflow_dispatch pr=${{ inputs.pr }}: run full job"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(
            gh pr list --state open --json headRefName --jq '
              [.[] | .headRefName | select(
                startswith("agent/") or startswith("cursor/") or startswith("claude/") or
                startswith("codex/") or startswith("bot/")
              )] | length
            '
          )"
          if [[ "${count}" -gt 0 ]]; then
            echo "open bot PRs: ${count}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no open bot PRs; skipping checkout and stall scan"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"
      - name: Flag stalled bot PRs
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STALL_HOURS: ${{ inputs.hours || '6' }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node frontend/scripts/stale-prs.mjs --repo "$GITHUB_REPOSITORY" --comment
