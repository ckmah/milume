name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "website/**"
      - "demos/recipes/**"
      - "milume/**"
      - ".github/workflows/pages.yml"
      - ".github/actions/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            frontend/package-lock.json

      # website/node_modules from cache; assemble-pages.sh skips its own npm ci then.
      - uses: ./.github/actions/node-modules
        with:
          dir: website

      - uses: ./.github/actions/node-modules
        with:
          dir: frontend

      - name: Playwright browser (recipe export prune + payload check)
        uses: ./.github/actions/playwright-browser

      - name: Restore marimo recipe export cache
        uses: actions/cache/restore@v4
        with:
          path: |
            demos/recipes/__marimo__
            .cache/marimo-export-recipes
          key: recipe-studio-${{ hashFiles('demos/recipes/squidpy_color.py', 'demos/data/ileum.h5ad', 'uv.lock') }}
          restore-keys: |
            recipe-studio-

      - name: Assemble landing + docs
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: uv run bash website/scripts/assemble-pages.sh

      - name: Check links in built site
        run: |
          mkdir -p _linkcheck && rm -rf _linkcheck/milume && cp -r site _linkcheck/milume

      - name: Lychee (internal links + anchors, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --offline --include-fragments --index-files index.html --no-progress
            --root-dir ${{ github.workspace }}/_linkcheck
            --exclude-path _linkcheck/milume/hero
            '_linkcheck/milume/**/*.html'

      - name: Install frontend deps
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/node-modules

      - name: Playwright browser
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/playwright-browser

      - name: Hero WebGL Playwright
        if: github.event_name == 'pull_request'
        run: cd frontend && npx playwright test --config=playwright.website.config.ts

      - name: Save marimo recipe export cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            demos/recipes/__marimo__
            .cache/marimo-export-recipes
          key: recipe-studio-${{ hashFiles('demos/recipes/squidpy_color.py', 'demos/data/ileum.h5ad', 'uv.lock') }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
