name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "demos/recipes/**"
      - "milume/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - ".github/workflows/pages.yml"
      - ".github/actions/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# pages.yml (every trigger), dashboard.yml, and preview publish/remove/sweep
# share this group. cancel-in-progress is false so one writer cannot cancel another.
concurrency:
  group: pages-push-refs/heads/main
  cancel-in-progress: false

jobs:
  recipe-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/recipe-export
        with:
          mode: consume

  build:
    needs: recipe-fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: recipe-export
          path: website/.cache/recipe-export

      - name: Require stamped recipe export
        run: python3 scripts/recipe_export_cache.py check

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            frontend/package-lock.json

      # website/node_modules from cache; assemble-pages.sh skips its own npm ci then.
      - uses: ./.github/actions/node-modules
        with:
          dir: website

      - uses: ./.github/actions/node-modules
        with:
          dir: frontend

      - name: Playwright browser (recipe export prune + payload check)
        uses: ./.github/actions/playwright-browser

      - name: Assemble landing + docs
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          MILUME_RECIPE_EXPORT_READY: "1"
        run: uv run bash website/scripts/assemble-pages.sh

      - name: Check links in built site
        run: |
          mkdir -p _linkcheck && rm -rf _linkcheck/milume && cp -r site _linkcheck/milume

      - name: Lychee (internal links + anchors, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --offline --include-fragments --index-files index.html --no-progress
            --root-dir ${{ github.workspace }}/_linkcheck
            --exclude-path _linkcheck/milume/hero
            '_linkcheck/milume/**/*.html'

      - name: Install frontend deps
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/node-modules

      - name: Playwright browser
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/playwright-browser

      - name: Hero WebGL Playwright
        if: github.event_name == 'pull_request'
        run: cd frontend && npx playwright test --config=playwright.website.config.ts

      # Replaces the site root and leaves pr/ and dashboard/ on the branch.
      - name: Publish site to gh-pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash tools/pages/publish_gh_pages.sh site "$GITHUB_WORKSPACE/site"
