name: Frontend e2e

# Path-gated Playwright tiers (skips when the change set has no frontend/):
#   core        — shared shadcn / Soft Float chrome
#   landmarks   — LandmarksWidget

on:
  # The `changes` job path-filters tiers; `gate` always runs (even when tiers skip).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-generate snapshots; download artifact and commit locally"
        type: boolean
        default: false
      tier:
        description: "Which tier(s) to run"
        type: choice
        options:
          - all
          - core
          - landmarks
        default: all

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      is_dispatch: ${{ github.event_name == 'workflow_dispatch' }}
      dispatch_tier: ${{ inputs.tier || '' }}

  e2e-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright-browser
      - name: Run core e2e
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_snapshots != true }}
        run: npm run test:e2e:core
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
      - name: Update core snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        run: npm run test:e2e:core -- --update-snapshots=all
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-core
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-core
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        with:
          name: playwright-snapshots-core
          path: frontend/e2e/core/**/*-snapshots/
          retention-days: 14
          if-no-files-found: ignore

  # The volume spec is ~70 tests of software-GL cube rendering: split it across runners,
  # duration-weighted LPT sharding (scripts/e2e-shard.mjs + e2e-shard-weights.json).
  # Only the default-harness leg owns snapshots, so it alone runs for update_snapshots.
  e2e-landmarks:
    needs: changes
    if: needs.changes.outputs.landmarks == 'true'
    name: e2e-landmarks (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: volume-1, harness: landmarks-volume, cmd: "node scripts/e2e-shard.mjs 1/3 e2e/landmarks/landmarks-volume.spec.ts" }
          - { id: volume-2, harness: landmarks-volume, cmd: "node scripts/e2e-shard.mjs 2/3 e2e/landmarks/landmarks-volume.spec.ts" }
          - { id: volume-3, harness: landmarks-volume, cmd: "node scripts/e2e-shard.mjs 3/3 e2e/landmarks/landmarks-volume.spec.ts" }
          - { id: default, harness: landmarks, cmd: "npx playwright test e2e/landmarks" }
    env:
      UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright-browser
      - name: Landmarks unit tests
        if: matrix.id == 'default'
        run: npm run test:unit
      - name: Run landmarks e2e
        if: ${{ env.UPDATE != 'true' }}
        run: ${{ matrix.cmd }}
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
          E2E_HARNESS: ${{ matrix.harness }}
      - name: Update landmarks snapshots
        if: ${{ env.UPDATE == 'true' && matrix.id == 'default' }}
        run: ${{ matrix.cmd }} --update-snapshots=all
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
          E2E_HARNESS: ${{ matrix.harness }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-landmarks-${{ matrix.id }}
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-landmarks-${{ matrix.id }}
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ env.UPDATE == 'true' && matrix.id == 'default' }}
        with:
          name: playwright-snapshots-landmarks
          path: frontend/e2e/landmarks/**/*-snapshots/
          retention-days: 14
          if-no-files-found: ignore

  # One stable check to require in branch protection: path-gated jobs may be skipped,
  # which a required check cannot tolerate; this job passes unless a tier failed.
  post-ui-evidence-comment:
    needs: [changes, e2e-landmarks]
    if: github.event_name == 'pull_request' && needs.changes.outputs.landmarks == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: playwright-test-results-landmarks-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comment Playwright artifact pointers on PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node frontend/scripts/post-pr-playwright-comment.mjs

  gate:
    needs: [changes, e2e-core, e2e-landmarks, post-ui-evidence-comment]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any selected tier failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "tier results: ${RESULTS}"
          [[ "${RESULTS}" != *failure* && "${RESULTS}" != *cancelled* ]]
