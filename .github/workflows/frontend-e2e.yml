name: Frontend e2e

# Path-gated Playwright tiers (skips when the change set has no frontend/):
#   core        — shared shadcn / Soft Float chrome
#   landmarks   — LandmarksWidget

on:
  # No `paths:` here: the `changes` job filters, so `gate` always reports.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-generate snapshots; download artifact and commit locally"
        type: boolean
        default: false
      tier:
        description: "Which tier(s) to run"
        type: choice
        options:
          - all
          - core
          - landmarks
        default: all

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      landmarks: ${{ steps.select.outputs.landmarks }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Single source of truth, shared with `npm run verify`.
          filters: .github/e2e-tiers.json

      - name: Select tiers
        id: select
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ inputs.tier || '' }}
          CORE: ${{ steps.filter.outputs.core || 'false' }}
          LANDMARKS: ${{ steps.filter.outputs.landmarks || 'false' }}
          INFRA: ${{ steps.filter.outputs.infra || 'false' }}
        run: |
          set -euo pipefail
          core=false
          landmarks=false
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            case "${TIER}" in
              all) core=true; landmarks=true ;;
              core) core=true ;;
              landmarks) landmarks=true ;;
            esac
          else
            if [[ "${INFRA}" == "true" ]]; then
              core=true; landmarks=true
            else
              [[ "${CORE}" == "true" ]] && core=true
              [[ "${LANDMARKS}" == "true" ]] && landmarks=true
            fi
          fi
          echo "core=${core}" >> "$GITHUB_OUTPUT"
          echo "landmarks=${landmarks}" >> "$GITHUB_OUTPUT"
          echo "Selected tiers: core=${core} landmarks=${landmarks}"

  e2e-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run core e2e
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_snapshots != true }}
        run: npm run test:e2e:core
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
      - name: Update core snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        run: npm run test:e2e:core -- --update-snapshots=all
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-core
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-core
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        with:
          name: playwright-snapshots-core
          path: frontend/e2e/core/**/*-snapshots/
          retention-days: 14
          if-no-files-found: ignore

  e2e-landmarks:
    needs: changes
    if: needs.changes.outputs.landmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run landmarks e2e
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_snapshots != true }}
        run: npm run test:e2e:landmarks
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
      - name: Update landmarks snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        run: npm run test:e2e:landmarks -- --update-snapshots=all
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-landmarks
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-landmarks
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        with:
          name: playwright-snapshots-landmarks
          path: frontend/e2e/landmarks/**/*-snapshots/
          retention-days: 14
          if-no-files-found: ignore

  # One stable check to require in branch protection: path-gated jobs may be skipped,
  # which a required check cannot tolerate; this job passes unless a tier failed.
  gate:
    needs: [changes, e2e-core, e2e-landmarks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any selected tier failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "tier results: ${RESULTS}"
          [[ "${RESULTS}" != *failure* && "${RESULTS}" != *cancelled* ]]
