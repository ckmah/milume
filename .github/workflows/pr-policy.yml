name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-mergeable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail loudly when the PR has merge conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node frontend/scripts/check-pr-mergeable.mjs

  demo-pins:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-demo-pins.sh

  public-api:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Importing milume needs the widget bundle paths to exist; the snapshot only reads signatures.
      - run: mkdir -p milume/static/bundled && touch milume/static/bundled/landmarks.mjs milume/static/bundled/widgets.css
      - name: check:public-api
        id: api
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen --no-dev python scripts/public_api.py --base "$BASE_SHA" --report public-api-report.md
      # Public changes get public-api + needs-clarence; internal-only changes get the comment only.
      - name: Label and comment
        if: steps.api.outputs.public_changed == 'true' || steps.api.outputs.internal_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PUBLIC: ${{ steps.api.outputs.public_changed }}
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          if [[ "${PUBLIC}" == "true" ]]; then
            gh label create public-api --color B60205 --description "Changes milume's public API" -R "${GITHUB_REPOSITORY}" 2>/dev/null || true
            gh label create needs-clarence --color D93F0B --description "Stops for Clarence before merge" -R "${GITHUB_REPOSITORY}" 2>/dev/null || true
            gh api "${repo}/issues/${PR}/labels" -f "labels[]=public-api" -f "labels[]=needs-clarence" >/dev/null
          fi
          id=$(gh api "${repo}/issues/${PR}/comments" --paginate --jq '.[] | select(.body | startswith("<!-- public-api-report -->")) | .id' | head -1)
          if [[ -n "${id}" ]]; then
            gh api -X PATCH "${repo}/issues/comments/${id}" -F body=@public-api-report.md >/dev/null
          else
            gh api "${repo}/issues/${PR}/comments" -F body=@public-api-report.md >/dev/null
          fi
      - name: Fail on a stale snapshot or a missing CHANGELOG line
        if: steps.api.outcome == 'failure'
        run: exit 1

  # Runs on every PR event so a later push can't hide an earlier failure; the stack rule applies once ready.
  pr-hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check:pr-stack
        if: github.event.pull_request.draft == false
        run: node frontend/scripts/check-pr-hygiene.mjs stack
      - name: check:pr-overlap
        if: success() || failure()
        run: node frontend/scripts/check-pr-hygiene.mjs overlap --comment

  ci-legs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node frontend/scripts/check-ci-legs.mjs

  e2e-scope:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:e2e-scope

  changes:
    uses: ./.github/workflows/detect-changes.yml

  # Ready UI PRs (ui paths) or any PR labelled ui-evidence; per-item Visual acceptance gate (#262).
  ui-pr-policy:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || contains(github.event.pull_request.labels.*.name, 'ui-evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lib/pr-policy.mjs uses path.matchesGlob (stable in Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ask the API for the PR's files instead of diffing against a shallow base
      # (a depth-1 fetch of the base has no merge base with the PR head: exit 128).
      - name: Collect changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > changed.txt
          echo "Changed files: $(wc -l < changed.txt)"
          {
            echo "paths<<EOF"
            cat changed.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch linked issue bodies
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node frontend/scripts/fetch-linked-issue-bodies.mjs

      - name: check:pr-policy
        working-directory: frontend
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES: ${{ steps.paths.outputs.paths }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-pr-policy.mjs --issue-bodies-file ../issue-bodies.json --draft "$PR_DRAFT"

  agent-policy-tests:
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check:shot-spec
        run: node scripts/check-shot-spec.mjs
        working-directory: frontend
      - run: node --test scripts/check-agent-policy.test.mjs
        working-directory: frontend
