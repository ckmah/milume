name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  ui-pr-policy:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lib/pr-policy.mjs uses path.matchesGlob (stable in Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ask the API for the PR's files instead of diffing against a shallow base
      # (a depth-1 fetch of the base has no merge base with the PR head: exit 128).
      - name: Collect changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > changed.txt
          echo "Changed files: $(wc -l < changed.txt)"
          {
            echo "paths<<EOF"
            cat changed.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch linked issue bodies
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node frontend/scripts/fetch-linked-issue-bodies.mjs

      - name: check:pr-policy
        working-directory: frontend
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          CHANGED_FILES: ${{ steps.paths.outputs.paths }}
        run: node scripts/check-pr-policy.mjs --issue-bodies-file ../issue-bodies.json --draft "$PR_DRAFT"

  agent-policy-tests:
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/check-agent-policy.test.mjs
        working-directory: frontend
