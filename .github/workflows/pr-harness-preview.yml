name: PR harness preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "frontend/**"
      - ".github/workflows/pr-harness-preview.yml"
      - "tools/pages/**"
  schedule:
    # Sweep /pr/<n>/ directories whose PRs are already closed.
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/node-modules

      - name: Build harness previews
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cd frontend && npm run build:preview

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: harness-preview
          path: frontend/dist/preview
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Serialize gh-pages writes with the docs deploy group so a dashboard
    # overlay cannot publish a tree from before this preview landed.
    concurrency:
      group: pages-push-refs/heads/main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download preview
        uses: actions/download-artifact@v4
        with:
          name: harness-preview
          path: preview-dist

      - name: Publish /pr/<n>/ on gh-pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash tools/pages/publish_gh_pages.sh preview "${{ github.event.pull_request.number }}" "$GITHUB_WORKSPACE/preview-dist"

      - name: Record preview metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p preview-meta
          printf '{"pr":"%s","sha":"%s","action":"publish"}\n' "$PR_NUMBER" "$HEAD_SHA" > preview-meta/preview.json

      - uses: actions/upload-artifact@v4
        with:
          name: harness-preview-meta
          path: preview-meta/preview.json
          retention-days: 1

  # Same-repo PRs still run as the head branch. The github-pages environment
  # only allows main, so this job is what fails closed until that policy
  # includes the workflow. The workflow_run deploy on main is the path that
  # publishes once this file is on the default branch.
  live:
    needs: publish
    if: needs.publish.result == 'success'
    # The environment only allows main. A refusal here must not fail the
    # workflow: the workflow_run listener on main is what publishes.
    continue-on-error: true
    runs-on: ubuntu-latest
    concurrency:
      group: pages-push-refs/heads/main
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://ckmah.github.io/milume/pr/${{ github.event.pull_request.number }}/
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Merge pr/ into the current Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | sort_by(.created_at) | last | .id // empty')"
          if [[ -z "$artifact_id" ]]; then
            echo "no github-pages artifact to merge into" >&2
            exit 1
          fi
          echo "base artifact $artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/pages.zip
          rm -rf pages-artifact combined
          mkdir -p pages-artifact combined
          unzip -q /tmp/pages.zip -d pages-artifact
          if [[ -f pages-artifact/artifact.tar ]]; then
            tar -xf pages-artifact/artifact.tar -C combined
          else
            cp -a pages-artifact/. combined/
            rm -f combined/artifact.tar
          fi
          git fetch --depth 1 origin gh-pages
          for top in pr dashboard; do
            if git cat-file -e "origin/gh-pages:${top}" 2>/dev/null; then
              rm -rf "combined/${top}"
              git archive "origin/gh-pages" "$top" | tar -x -C combined
              echo "overlaid ${top}"
            fi
          done
          test -s combined/index.html
          test -s combined/dashboard/index.html

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Comment with preview links
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/pages/pr_preview_comment.py --pr "$PR_NUMBER" --sha "$HEAD_SHA"

  remove:
    if: >
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pages-push-refs/heads/main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete /pr/<n>/
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash tools/pages/publish_gh_pages.sh delete "${{ github.event.pull_request.number }}"

      - name: Record removal metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p preview-meta
          printf '{"pr":"%s","sha":"%s","action":"delete"}\n' "$PR_NUMBER" "$HEAD_SHA" > preview-meta/preview.json

      - uses: actions/upload-artifact@v4
        with:
          name: harness-preview-meta
          path: preview-meta/preview.json
          retention-days: 1

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-push-refs/heads/main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete previews for closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash tools/pages/publish_gh_pages.sh sweep
