name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  test:
    needs: changes
    if: needs.changes.outputs.ci_frontend == 'true' || needs.changes.outputs.ci_pytest == 'true' || needs.changes.outputs.ci_uv_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        if: needs.changes.outputs.ci_pytest == 'true' || needs.changes.outputs.ci_uv_build == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/node-modules

      - if: needs.changes.outputs.ci_frontend == 'true'
        run: npm run check:chrome
        working-directory: frontend

      - if: needs.changes.outputs.ci_frontend == 'true'
        run: npm run typecheck
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - if: needs.changes.outputs.ci_pytest == 'true'
        run: uv sync --group dev

      - if: needs.changes.outputs.ci_pytest == 'true'
        run: uv run pytest

      - if: needs.changes.outputs.ci_uv_build == 'true'
        run: scripts/check-wheel-bundle.sh
