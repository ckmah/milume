name: Detect changes

on:
  workflow_call:
    inputs:
      dispatch_tier:
        description: workflow_dispatch tier (all | core | landmarks)
        required: false
        type: string
        default: ""
      is_dispatch:
        description: true when the caller is workflow_dispatch
        required: false
        type: boolean
        default: false
    outputs:
      core:
        value: ${{ jobs.detect.outputs.core }}
      landmarks:
        value: ${{ jobs.detect.outputs.landmarks }}
      volume_cube:
        value: ${{ jobs.detect.outputs.volume_cube }}
      ui:
        value: ${{ jobs.detect.outputs.ui }}
      policy:
        value: ${{ jobs.detect.outputs.policy }}
      ci_frontend:
        value: ${{ jobs.detect.outputs.ci_frontend }}
      ci_pytest:
        value: ${{ jobs.detect.outputs.ci_pytest }}
      ci_uv_build:
        value: ${{ jobs.detect.outputs.ci_uv_build }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      landmarks: ${{ steps.select.outputs.landmarks }}
      volume_cube: ${{ steps.select.outputs.volume_cube }}
      ui: ${{ steps.select.outputs.ui }}
      policy: ${{ steps.select.outputs.policy }}
      ci_frontend: ${{ steps.select.outputs.ci_frontend }}
      ci_pytest: ${{ steps.select.outputs.ci_pytest }}
      ci_uv_build: ${{ steps.select.outputs.ci_uv_build }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: inputs.is_dispatch != true
        with:
          filters: .github/e2e-tiers.json
          list-files: csv

      - name: Select tiers
        id: select
        env:
          IS_DISPATCH: ${{ inputs.is_dispatch }}
          TIER: ${{ inputs.dispatch_tier }}
          CORE: ${{ steps.filter.outputs.core || 'false' }}
          LANDMARKS: ${{ steps.filter.outputs.landmarks || 'false' }}
          VOLUME_CUBE: ${{ steps.filter.outputs.volume_cube || 'false' }}
          INFRA_FULL: ${{ steps.filter.outputs.infra_full || 'false' }}
          INFRA_CORE: ${{ steps.filter.outputs.infra_core || 'false' }}
          POLICY: ${{ steps.filter.outputs.policy || 'false' }}
          CI_FRONTEND: ${{ steps.filter.outputs.ci_frontend || 'false' }}
          CI_PYTHON: ${{ steps.filter.outputs.ci_python || 'false' }}
          ALL_FILES: ${{ steps.filter.outputs.all_files || '' }}
        run: |
          set -euo pipefail
          core=false
          landmarks=false
          volume_cube=false
          policy=false
          ci_frontend=false
          ci_pytest=false
          ci_uv_build=false
          if [[ "${IS_DISPATCH}" == "true" ]]; then
            case "${TIER}" in
              all) core=true; landmarks=true ;;
              core) core=true ;;
              landmarks) landmarks=true ;;
            esac
            volume_cube=true
            ci_frontend=true
            ci_pytest=true
            ci_uv_build=true
          else
            [[ "${POLICY}" == "true" ]] && policy=true
            [[ "${VOLUME_CUBE}" == "true" ]] && volume_cube=true
            if [[ "${INFRA_FULL}" == "true" ]]; then
              core=true
              landmarks=true
            elif [[ "${INFRA_CORE}" == "true" ]]; then
              core=true
              [[ "${LANDMARKS}" == "true" ]] && landmarks=true
            else
              [[ "${CORE}" == "true" ]] && core=true
              [[ "${LANDMARKS}" == "true" ]] && landmarks=true
            fi
            [[ "${CI_FRONTEND}" == "true" ]] && ci_frontend=true
            if [[ "${CI_PYTHON}" == "true" ]]; then
              ci_pytest=true
              milume_py_only=true
              if [[ -n "${ALL_FILES}" ]]; then
                IFS=',' read -ra files <<< "${ALL_FILES}"
                for f in "${files[@]}"; do
                  [[ "$f" =~ ^milume/.+\.py$ ]] || milume_py_only=false
                done
              else
                milume_py_only=false
              fi
              if [[ "${milume_py_only}" == "true" ]]; then
                ci_frontend=false
                ci_uv_build=false
              else
                ci_uv_build=true
              fi
            fi
          fi
          ui=false
          if [[ "${core}" == "true" || "${landmarks}" == "true" ]]; then
            ui=true
          fi
          echo "core=${core}" >> "$GITHUB_OUTPUT"
          echo "landmarks=${landmarks}" >> "$GITHUB_OUTPUT"
          echo "volume_cube=${volume_cube}" >> "$GITHUB_OUTPUT"
          echo "ui=${ui}" >> "$GITHUB_OUTPUT"
          echo "policy=${policy}" >> "$GITHUB_OUTPUT"
          echo "ci_frontend=${ci_frontend}" >> "$GITHUB_OUTPUT"
          echo "ci_pytest=${ci_pytest}" >> "$GITHUB_OUTPUT"
          echo "ci_uv_build=${ci_uv_build}" >> "$GITHUB_OUTPUT"
          echo "Selected: core=${core} landmarks=${landmarks} volume_cube=${volume_cube} ui=${ui} policy=${policy} ci_frontend=${ci_frontend} ci_pytest=${ci_pytest} ci_uv_build=${ci_uv_build}"
