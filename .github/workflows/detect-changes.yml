name: Detect changes

on:
  workflow_call:
    inputs:
      dispatch_tier:
        description: workflow_dispatch tier (all | core | landmarks)
        required: false
        type: string
        default: ""
      is_dispatch:
        description: true when the caller is workflow_dispatch
        required: false
        type: boolean
        default: false
    outputs:
      core:
        value: ${{ jobs.detect.outputs.core }}
      landmarks:
        value: ${{ jobs.detect.outputs.landmarks }}
      marimo_api:
        value: ${{ jobs.detect.outputs.marimo_api }}
      volume_cube:
        value: ${{ jobs.detect.outputs.volume_cube }}
      ui:
        value: ${{ jobs.detect.outputs.ui }}
      policy:
        value: ${{ jobs.detect.outputs.policy }}
      ci_frontend:
        value: ${{ jobs.detect.outputs.ci_frontend }}
      ci_pytest:
        value: ${{ jobs.detect.outputs.ci_pytest }}
      ci_uv_build:
        value: ${{ jobs.detect.outputs.ci_uv_build }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      landmarks: ${{ steps.select.outputs.landmarks }}
      volume_cube: ${{ steps.select.outputs.volume_cube }}
      marimo_api: ${{ steps.select.outputs.marimo_api }}
      ui: ${{ steps.select.outputs.ui }}
      policy: ${{ steps.select.outputs.policy }}
      ci_frontend: ${{ steps.select.outputs.ci_frontend }}
      ci_pytest: ${{ steps.select.outputs.ci_pytest }}
      ci_uv_build: ${{ steps.select.outputs.ci_uv_build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tiers, legs and dispatch rules all live in .github/e2e-tiers.json (`npm run check:ci-legs`).
      - name: Tier filters
        id: tiers
        if: inputs.is_dispatch != true
        run: echo "filters=$(node frontend/scripts/select-ci-legs.mjs --filters)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: inputs.is_dispatch != true
        with:
          filters: ${{ steps.tiers.outputs.filters }}

      - name: Select legs
        id: select
        env:
          IS_DISPATCH: ${{ inputs.is_dispatch }}
          TIER: ${{ inputs.dispatch_tier }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        run: node frontend/scripts/select-ci-legs.mjs
