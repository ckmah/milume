name: Dashboard

on:
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Pages"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "tools/dashboard/**"
      - ".github/workflows/dashboard.yml"

# Same group as pages.yml and the preview publish/remove/sweep jobs.
concurrency:
  group: pages-push-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  refresh:
    if: >
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event != 'pull_request'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.hash.outputs.changed }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore history and last hash from gh-pages
        continue-on-error: true
        run: |
          set -euo pipefail
          cd tools/dashboard
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git show origin/gh-pages:dashboard/needs_you_history.json > needs_you_history.json 2>/dev/null || true
            git show origin/gh-pages:dashboard/content_hash.txt > last_hash.txt 2>/dev/null || true
          fi

      - name: Fetch snapshot and render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd tools/dashboard
          python3 fetch_snapshot.py
          python3 render_page.py
          test -s dashboard.html
          test -s summary.txt
          grep -q '^as_of:' summary.txt

      - name: Compare content hash
        id: hash
        run: |
          set -euo pipefail
          cd tools/dashboard
          digest="$(tr -d '[:space:]' < content_hash.txt)"
          prev=""
          if [[ -f last_hash.txt ]]; then
            prev="$(tr -d '[:space:]' < last_hash.txt)"
          fi
          changed=false
          if [[ -z "$prev" || "$prev" != "$digest" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "hash=${digest:0:12} prev=${prev:0:12} changed=$changed"

      - name: Upload generated dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-generated
          path: |
            tools/dashboard/dashboard.html
            tools/dashboard/summary.txt
            tools/dashboard/content_hash.txt
            tools/dashboard/needs_you_history.json
          if-no-files-found: error

  publish:
    needs: refresh
    if: github.event_name != 'pull_request' && needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download generated dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-generated
          path: tools/dashboard

      - name: Push to gh-pages when content changed
        if: needs.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/dashboard/push_gh_pages.sh tools/dashboard
