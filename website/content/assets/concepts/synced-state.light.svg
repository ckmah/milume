<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Python, SpatialData on disk, and the widget share synced state</title>
  <desc id="desc">AnnData and SpatialData on the left connect to the map and Inspect cube on the right. Arrows label selections, landmarks, focus, Inspect window fields, gene columns on demand, and image chunks on demand.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#0f172a">What crosses between Python and the browser</text>
  <rect x="40" y="60" width="320" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Python</text>
  <rect x="64" y="108" width="272" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="200" y="132" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#334155">AnnData</text>
  <text x="200" y="150" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">obsm, obs, X by reference</text>
  <rect x="64" y="180" width="272" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="200" y="204" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#334155">SpatialData on disk</text>
  <text x="200" y="222" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">Zarr image pyramid, shapes</text>
  <rect x="520" y="60" width="320" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="680" y="88" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Widget</text>
  <rect x="544" y="108" width="120" height="72" rx="6" fill="#ecfdf5" stroke="#0d9488"/>
  <text x="604" y="138" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#115e59">2D map</text>
  <text x="604" y="158" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b">deck.gl</text>
  <rect x="688" y="108" width="128" height="72" rx="6" fill="#ecfdf5" stroke="#0d9488"/>
  <text x="752" y="138" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#115e59">Inspect cube</text>
  <text x="752" y="158" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b">windowed volume</text>
  <rect x="544" y="200" width="272" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="680" y="224" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#475569">Camera, colors, layer toggles stay here</text>
  <path d="M360 150 H480" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480 150 H360" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow)" transform="translate(0,18)"/>
  <text x="420" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#0f766e">selections, landmarks,</text>
  <text x="420" y="154" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#0f766e">focus, inspect_*</text>
  <path d="M336 200 Q400 240 544 240" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="430" y="252" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#475569">gene columns on demand</text>
  <path d="M336 260 Q400 300 544 280" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="430" y="312" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#475569">image chunks on demand</text>
</svg>
