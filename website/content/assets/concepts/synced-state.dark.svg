<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Python, SpatialData on disk, and the widget share synced state</title>
  <desc id="desc">AnnData and SpatialData on the left connect to the 2D map and Inspect cube on the right. Solid arrows carry synced selections and Inspect fields; dashed arrows show gene columns and image chunks fetched on demand.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#0f172a"/>
  <text x="440" y="32" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">What crosses between Python and the browser</text>
  <rect x="40" y="60" width="320" height="300" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Python</text>
  <rect x="64" y="108" width="272" height="56" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="200" y="132" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#e2e8f0">AnnData</text>
  <text x="200" y="150" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">obsm, obs, X by reference</text>
  <rect x="64" y="180" width="272" height="56" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="200" y="204" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#e2e8f0">SpatialData on disk</text>
  <text x="200" y="222" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">Zarr image pyramid, shapes</text>
  <rect x="520" y="60" width="320" height="300" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="680" y="88" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Widget</text>
  <rect x="544" y="108" width="120" height="72" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="604" y="138" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#ccfbf1">2D map</text>
  <text x="604" y="158" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#94a3b8">deck.gl</text>
  <rect x="688" y="108" width="128" height="72" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="752" y="138" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#ccfbf1">Inspect cube</text>
  <text x="752" y="158" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#94a3b8">windowed volume</text>
  <rect x="544" y="200" width="272" height="140" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="680" y="224" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#94a3b8">Camera, colors, layer toggles stay here</text>
  <text x="440" y="112" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5eead4">selections, landmarks, focused selection</text>
  <text x="440" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5eead4">inspect_cx/cy, inspect_open, volume_cut</text>
  <path d="M360 136 H520" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <path d="M520 154 H360" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <path d="M336 136 C 408 136, 472 144, 544 144" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="418" y="168" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#cbd5e1">gene columns on demand</text>
  <path d="M336 208 C 420 208, 560 168, 688 144" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="418" y="248" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#cbd5e1">image chunks on demand</text>
</svg>
