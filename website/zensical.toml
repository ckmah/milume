[project]
site_name = "milume"
site_url = "https://ckmah.github.io/milume/docs/"
site_description = "Interactive notebook widgets for spatial omics — install guides and widget reference."
site_author = "ckmah"
copyright = "Copyright &copy; ckmah — milume"
repo_url = "https://github.com/ckmah/milume"
repo_name = "Star on GitHub"

docs_dir = "content"
site_dir = "dist"

extra_css = ["stylesheets/bridge.css", "stylesheets/tools.css", "stylesheets/recipe-studio.css"]
extra_javascript = ["javascripts/tools.js"]

nav = [
  { Home = "index.md" },
  { "Get started" = [
    { Install = "get-started/install.md" },
    { "Tutorial: explore cells in 2D" = "get-started/tutorial-explore-cells-2d.md" },
    { "Tutorial: 3D with SpatialData" = "get-started/tutorial-spatialdata-3d.md" },
  ] },
  { "How-to guides" = [
    "how-to/recipes/index.md",
    { "Squidpy niche colour" = "how-to/recipes/squidpy_color/index.md" },
    { "Load AnnData / SpatialData" = "how-to/load-anndata-spatialdata.md" },
    { "Use selections downstream" = "how-to/use-selections-downstream.md" },
    { "Draw and export landmarks" = "how-to/draw-export-landmarks.md" },
    { "Match plot colors (squidpy)" = "how-to/match-plot-colors-squidpy.md" },
    { "Use with AI agents" = "how-to/use-with-ai-agents.md" },
  ] },
  { Reference = [
    { "Python API" = [
      { peek = "reference/api/peek.md" },
      { LandmarksWidget = "reference/api/landmarks.md" },
      { Measure = "reference/api/measure.md" },
    ] },
    { "Widget UI" = [
      "reference/ui/index.md",
      { Navigate = "reference/ui/navigate.md" },
      { "Select regions" = "reference/ui/select-regions.md" },
      { Landmarks = "reference/ui/landmarks.md" },
      { "Color & layers" = "reference/ui/color-layers.md" },
      { "Inspect in 3D" = "reference/ui/inspect-3d.md" },
      { Probe = "reference/ui/probe.md" },
    ] },
    { "Keyboard shortcuts" = "reference/keyboard-shortcuts.md" },
    { Changelog = "reference/changelog.md" },
  ] },
]

[project.extra]
homepage = "https://ckmah.github.io/milume/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ckmah/milume"

[project.plugins.mkdocstrings]
handlers = { python = { paths = [".."], options = { docstring_style = "numpy", docstring_section_style = "table", docstring_options = { ignore_init_summary = true } } } }

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo/milume-mark.svg"
favicon = "assets/logo/favicon.ico"

[project.theme.font]
text = "IBM Plex Sans"
code = "JetBrains Mono"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
icon.logo = "assets/logo/milume-icon-light.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
icon.logo = "assets/logo/milume-icon-dark.svg"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = { base_path = ["snippets"], check_paths = true }
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
