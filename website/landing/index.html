<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>milume: a thinking surface for spatial omics</title>
    <meta
      name="description"
      content="Layer images, cells, and transcripts in one reactive notebook widget."
    />
    <link rel="canonical" href="https://ckmah.github.io/milume/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="wordmark" href="./">
        <img
          class="wordmark-mark"
          src="assets/logo/milume-mark.svg"
          alt=""
          width="28"
          height="28"
        />
        milume
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="docs/">Docs</a>
        <a href="llms.txt">llms.txt</a>
        <a href="https://github.com/ckmah/milume">GitHub</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-label="Introduction">
        <div class="hero-plane" aria-hidden="true">
          <div class="milume-hero" data-milume-hero data-assets-base="assets/">
            <canvas class="milume-hero__canvas" width="1600" height="900"></canvas>
            <img
              class="milume-hero__poster"
              src="assets/hero-poster.png"
              alt=""
              width="1600"
              height="900"
              fetchpriority="high"
              decoding="async"
            />
          </div>
          <div class="hero-veil"></div>
        </div>

        <div class="hero-copy">
          <p class="brand">milume</p>
          <h1>A thinking surface for spatial omics.</h1>
          <p class="lede">
            Layer images, cells, and transcripts in one reactive notebook widget.
          </p>
          <div class="cta-group">
            <div class="install" role="group" aria-label="Install command">
              <code id="install-cmd">pip install milume</code>
              <button type="button" class="copy-btn" data-copy="#install-cmd">
                Copy
              </button>
            </div>
            <a class="btn btn-primary" href="docs/install/">Docs</a>
            <a
              class="btn btn-ghost"
              href="https://molab.marimo.io/github/ckmah/milume/blob/main/demos/landmarks.py"
              >Open demo</a
            >
          </div>
        </div>
      </section>

      <section class="promo-montage" aria-label="Product montage">
        <video
          class="promo-montage__video"
          src="assets/milume-montage-web.mp4"
          poster="assets/montage-poster.png"
          preload="metadata"
          muted
          playsinline
          controls
          width="1280"
          height="720"
        >
          <track kind="captions" />
        </video>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <a class="wordmark" href="./">milume</a>
        · MIT ·
        <a href="docs/">Documentation</a>
        ·
        <a href="index.md">index.md</a>
      </p>
    </footer>

    <script src="assets/hero-renderer.js" defer></script>
    <script src="main.js" defer></script>
  </body>
</html>
