[project]
name = "milume"
version = "2.0.0"
description = "Milume: explore spatial biology in your notebook. A tactile, reactive Jupyter (anywidget) surface for forming intuition about spatial omics data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ckmah" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "anywidget>=0.9.2",
    "geopandas>=1.1.4",
    "leidenalg>=0.12.0",
    "matplotlib>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=1.0",
    "scipy>=1.11",
    "shapely>=2.1.2",
    "spatialdata>=0.2",
    "traitlets>=5.0",
]

[project.optional-dependencies]
demo = [
    "huggingface-hub>=0.30",
    "igraph>=0.11",
    "marimo>=0.25.1",
    "scanpy>=1.10",
    "squidpy>=1.6",
    "spatialdata-io; python_version >= '3.12'",
]
test = [
    "geopandas>=1.1.4",
    "pandas>=2.0",
    "pytest>=8.3.3",
    "shapely>=2.1.2",
    "spatialdata>=0.2",
]

[project.urls]
Homepage = "https://github.com/ckmah/milume"
Repository = "https://github.com/ckmah/milume"
Issues = "https://github.com/ckmah/milume/issues"

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "huggingface-hub>=0.30",
    "mkdocstrings-python>=2.0.9",
    "pytest>=8.3.3",
    "ruff>=0.16.6",
    "scanpy>=1.10",
    "shapely>=2.1.2",
    "spatialdata>=0.2",
    "spatialdata-io; python_version >= '3.12'",
    "squidpy>=1.6",
    "watchfiles>=1.2.0",
    "zensical>=0.0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milume"]
# The engine sources in static/*.js are bundled into static/bundled/landmarks.mjs;
# only the (gitignored) bundles are loaded at runtime.
exclude = ["milume/static/*.js"]

# Ship the use-milume agent skill inside the package (milume/skills/use-milume/SKILL.md).
[tool.hatch.build.targets.wheel.force-include]
".agents/skills/use-milume/SKILL.md" = "milume/skills/use-milume/SKILL.md"

[tool.hatch.build.targets.sdist]
# Keep the sdist small (~60 MB -> a few MB): the docs site, README screenshots
# and Playwright e2e snapshots aren't needed to build or test the package.
exclude = [
  "website/",
  "assets/*.png",
  "frontend/e2e/**/*-snapshots/",
]

[tool.hatch.build.targets.sdist.force-include]
".agents/skills/use-milume/SKILL.md" = ".agents/skills/use-milume/SKILL.md"

[tool.hatch.build]
artifacts = ["milume/static/bundled/*"]

[tool.hatch.version]
path = "milume/__init__.py"

[tool.uv.sources]
spatialdata-io = { git = "https://github.com/ckmah/spatialdata-io", branch = "pyxa-reader" }

[tool.pytest.ini_options]
testpaths = ["tests"]
