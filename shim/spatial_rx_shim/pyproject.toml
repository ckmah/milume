[project]
name = "spatial-rx"
version = "1.0.2"
description = "Deprecated: spatial-rx is now Milume. This release only re-exports `milume` as `spatial_rx`."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ckmah" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["milume>=1.0.1"]

[project.urls]
Homepage = "https://github.com/ckmah/milume"
Repository = "https://github.com/ckmah/milume"
Issues = "https://github.com/ckmah/milume/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_rx"]
